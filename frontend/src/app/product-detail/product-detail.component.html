<div class="container my-5">
    <div class="row">
        <div class="col-md-6 d-flex align-items-center justify-content-center">
            <div class="p-3 border rounded shadow-lg bg-white">
                <img [src]="product?.image" *ngIf="product?.image" class="img-fluid rounded" alt="{{ product?.name }}">
            </div>
        </div>
        <div class="col-md-6">
            <div class="p-4 border rounded shadow-sm bg-light">
                <h2 class="fw-bold mb-3">{{ product?.name }}</h2>
                <p class="text-muted fs-5">{{ product?.description }}</p>
                <p class="fw-bold fs-3 text-primary">{{ product?.price | currency }}</p>

                <button class="btn btn-success w-100 py-3 fs-5" (click)="addToCart(product)">
                    🛒 Adicionar ao Carrinho
                </button>
            </div>
        </div>
    </div>

    <div class="row mt-5">
        <div class="col-md-12">
            <div class="p-4 border rounded shadow-sm bg-white">
                <h4 class="fw-bold">Detalhes do Produto</h4>
                <p class="text-muted">
                   {{ product?.description }}
                </p>
            </div>
        </div>
    </div>
</div>
