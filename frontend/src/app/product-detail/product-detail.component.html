<div class="container my-5">
    <div class="row">
        <div class="col-md-6">
            <img [src]="product?.image" *ngIf="product?.image" class="img-fluid rounded shadow-sm" alt="{{ product?.name }}">
        </div>
        <div class="col-md-6">
            <h2 class="fw-bold">{{ product?.name }}</h2>
            <p class="text-muted">{{ product?.description }}</p>
            <p class="fw-bold fs-4">{{ product?.price | currency }}</p>
            <button class="btn btn-success w-100 mt-3" (click)="addToCart(product)">Adicionar ao carrinho</button>
        </div>
    </div>
</div>
