<app-alert></app-alert>

<div class="container my-5">
  <h2 class="text-center mb-4 fw-bold">Cadastro de Produto</h2>

  <form (submit)="submitForm()">
    <div class="mb-3">
      <label for="name" class="form-label fw-bold">Nome</label>
      <input type="text" class="form-control" id="name" [(ngModel)]="product.name" name="name" required>
    </div>

    <div class="mb-3">
      <label for="description" class="form-label fw-bold">Descrição</label>
      <textarea class="form-control" id="description" [(ngModel)]="product.description" name="description" required></textarea>
    </div>

    <div class="mb-3">
      <label for="price" class="form-label fw-bold">Preço</label>
      <input type="number" class="form-control" id="price" [(ngModel)]="product.price" name="price" required min="0.01" step="0.01">
    </div>

    <div class="mb-3">
      <label for="image" class="form-label fw-bold">URL da Imagem (Opcional)</label>
      <input type="text" class="form-control" id="image" [(ngModel)]="product.image" name="image">
    </div>

    <button type="submit" class="btn btn-primary w-100" [disabled]="isLoading">
      {{ isLoading ? 'Cadastrando...' : 'Cadastrar Produto' }}
    </button>
  </form>
</div>
