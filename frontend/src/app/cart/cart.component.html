<h2 class="mt-5 mb-4 text-center">Carrinho de Compras</h2>
<div class="row">
    <div class="col-md-8">
        <div *ngIf="cartItems.length === 0" class="alert alert-info">
            Seu carrinho está vazio.
        </div>
        <div *ngFor="let item of cartItems; let i = index" class="card mb-3 shadow-sm">
            <div class="card-body d-flex justify-content-between align-items-center">
                <div>
                    <h5 class="card-title">{{ item.name }}</h5>
                    <p class="card-text">{{ item.price | currency }}</p>
                    <label for="quantity-{{i}}">Quantidade:</label>
                    <input type="number" class="form-control w-50 d-inline" id="quantity-{{i}}"
                        [(ngModel)]="item.quantity" (change)="updateQuantity(item, item.quantity)">
                </div>
                <button class="btn btn-danger" (click)="removeItem(i)">Remover</button>
            </div>
        </div>
    </div>
    <div class="col-md-4">
        <div class="card shadow-sm">
            <div class="card-body text-center">
                <h4 class="card-title">Total</h4>
                <p class="card-text font-weight-bold">{{ total | currency }}</p>
                <button class="btn btn-primary btn-block mt-3">Finalizar Compra</button>
            </div>
        </div>
    </div>
</div>
